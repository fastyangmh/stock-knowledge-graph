name: Python pipeline tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --extra dev
      - name: Offline tests (no model download)
        run: uv run pytest -q
      - name: Validate currently published JSON
        run: uv run python -m local.validate_release
      - name: CLI smoke test in isolated directory
        run: |
          uv run python -m local.pipeline all --db /tmp/stock-graph-ci.db --output /tmp/stock-graph-ci-json
          uv run python -m local.pipeline validate --output /tmp/stock-graph-ci-json
