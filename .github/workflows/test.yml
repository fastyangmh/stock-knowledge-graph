name: Python pipeline tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run offline unit tests
        run: uv run pytest -q
