<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Knowledge Graph</title><link rel="stylesheet" href="./css/style.css"><script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js" defer></script><script src="./js/app.js" defer></script></head>
<body><header><h1>股票知識關聯圖</h1><p>Stock Knowledge Graph · 靜態資料展示原型</p></header><main><section class="toolbar"><label for="stock">選擇股票</label><select id="stock"></select><label for="relation">關聯類型</label><select id="relation"><option value="all">全部</option><option value="semantic_similarity">語意相似</option><option value="industry">產業關聯</option><option value="contains">資訊關聯</option></select><button id="fit">重設視圖</button></section><section class="layout"><div id="cy" role="img" aria-label="股票知識關聯圖"></div><aside id="details"><h2>節點資訊</h2><p>點選節點或連線查看詳細資訊。</p></aside></section><p class="note" id="status">載入中…</p></main><footer>示範資料，不構成投資建議。實際資料請由本地資料庫產出 JSON。</footer></body></html>
