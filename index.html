<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Stock Knowledge Graph｜股票知識關聯圖</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js" defer></script>
  <script src="./js/graph-utils.js" defer></script>
  <script src="./js/app.js" defer></script>
</head>
<body>
<header><p class="eyebrow">STOCK KNOWLEDGE GRAPH</p><h1>股票知識關聯圖</h1>
  <p>臺灣50 × 009816 · 雙來源研究股票池</p>
  <p class="notice">研究原型。公開網站目前仍為示範資料；來源歸屬不是買賣訊號，也不代表使用權利已核准。</p>
</header>
<main>
  <section class="toolbar" aria-label="股票與關係篩選">
    <label>股票池<select id="universe"><option value="all">全部股票</option></select></label>
    <label>搜尋<input id="search" type="search" placeholder="股票代碼或名稱" autocomplete="off"></label>
    <label>選擇股票<select id="stock" disabled></select></label>
    <label>關聯類型<select id="relation"><option value="all">全部關聯</option></select></label>
    <button id="fit" type="button" disabled>重設視圖</button>
    <button id="reload" type="button">重新載入</button>
  </section>
  <p id="coverage" class="note"></p>
  <p class="note">股票池與搜尋只篩選主股票清單；圖中仍可能顯示其他相關股票。名單日期不會自動延用至今天。</p>
  <p id="status" class="status" role="status" aria-live="polite">載入中…</p>
  <section id="graph-layout" class="layout" hidden>
    <div id="cy" role="img" aria-label="股票節點與關聯圖"></div>
    <aside id="details" aria-label="節點與關聯詳情"><h2>詳細資訊</h2><p>點選節點或連線查看來源、日期及證據。</p></aside>
  </section>
  <details id="source-panel"><summary>資料來源與使用條款</summary><div id="sources"></div></details>
  <noscript>需要啟用 JavaScript 才能使用圖譜；此頁不在瀏覽器進行 AI 計算。</noscript>
</main>
<footer>相似度不等於因果、股價相關性或預期報酬。正式資料使用前須完成資料品質、日期及授權審查。</footer>
</body>
</html>
